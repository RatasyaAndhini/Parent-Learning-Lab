    // ====================================================================
    // MODAL: KONFIGURASI DATABASE SUPABASE
    // ====================================================================
    function SupabaseConfigModal({ 
      lang, 
      t, 
      isOpen, 
      onClose, 
      sbConfig, 
      sbStatus, 
      onSaveConfig, 
      onDisconnect, 
      onSeedData, 
      showToast 
    }) {
      if (!isOpen) return null;

      const [urlInput, setUrlInput] = useState(sbConfig.url || '');
      const [keyInput, setKeyInput] = useState(sbConfig.anonKey || '');
      const [testing, setTesting] = useState(false);
      const [testMessage, setTestMessage] = useState(null);

      const handleTestAndSave = async (e) => {
        e.preventDefault();
        const trimmedUrl = urlInput.trim();
        const trimmedKey = keyInput.trim();

        if (!trimmedUrl || !trimmedKey) {
          setTestMessage({ 
            type: 'error', 
            text: lang === 'id' ? 'URL dan Anon Key harus diisi!' : 'URL and Anon Key are required!' 
          });
          return;
        }

        if (!trimmedUrl.startsWith('http://') && !trimmedUrl.startsWith('https://')) {
          setTestMessage({ 
            type: 'error', 
            text: lang === 'id' ? 'URL harus diawali https://' : 'URL must start with https://' 
          });
          return;
        }

        setTesting(true);
        setTestMessage(null);

        try {
          if (!window.supabase) {
            throw new Error('Supabase JS library CDN belum selesai dimuat.');
          }

          const testClient = window.supabase.createClient(trimmedUrl, trimmedKey, {
            auth: {
              storageKey: `parent-companion-connection-test-${Date.now()}`,
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false
            }
          });
          const tableChecks = [
            { table: 'parents', columns: 'id,name,email' },
            { table: 'children', columns: 'id,parent_id,nickname,birth_date,interests,learning_focus,available_time' },
            { table: 'activities', columns: 'id,title,description,category,min_age,max_age,duration_minutes,materials,steps,parent_tips,variations,learning_goal' },
            { table: 'activity_logs', columns: 'id,child_id,activity_id,status,scheduled_date,completed_at' },
            { table: 'journal_entries', columns: 'id,child_id,activity_id,entry_date,notes,engagement_level,milestone_tag,photo_url' },
            { table: 'milestones', columns: 'id,child_id,milestone_key,domain,age_group,description,description_en,is_achieved,achieved_at' }
          ];
          const results = await Promise.all(
            tableChecks.map(check => testClient.from(check.table).select(check.columns).limit(1))
          );
          const failedCheckIndex = results.findIndex(result => result.error);
          if (failedCheckIndex !== -1) {
            const failedTable = tableChecks[failedCheckIndex].table;
            throw new Error(`${failedTable}: ${results[failedCheckIndex].error.message}`);
          }

          setTestMessage({ 
            type: 'success', 
            text: lang === 'id' ? '✅ Berhasil terhubung ke Supabase!' : '✅ Connected successfully to Supabase!' 
          });
          onSaveConfig(trimmedUrl, trimmedKey);
          showToast(lang === 'id' ? '🟢 Supabase berhasil tersambung!' : '🟢 Supabase connected successfully!');
        } catch (err) {
          console.error('Supabase test failed:', err);
          setTestMessage({ 
            type: 'error', 
            text: (lang === 'id' ? 'Gagal terhubung: ' : 'Connection failed: ') + (err.message || 'Cek kembali URL & Key') 
          });
        } finally {
          setTesting(false);
        }
      };

      const copySqlSchema = () => {
        const sql = `-- Skema lengkap dan kebijakan akses aman: jalankan file supabase_schema.sql.
create extension if not exists pgcrypto;
create table if not exists public.parents (
  id uuid primary key default gen_random_uuid(), name varchar(100) not null,
  email varchar(100) unique not null, password_hash varchar(255) not null,
  created_at timestamptz default current_timestamp
);
create table if not exists public.children (
  id uuid primary key default gen_random_uuid(),
  parent_id uuid references public.parents(id) on delete cascade,
  nickname varchar(50) not null, birth_date date not null, interests text[],
  learning_focus text[], available_time integer default 20,
  created_at timestamptz default current_timestamp
);
create table if not exists public.activities (
  id uuid primary key default gen_random_uuid(), title varchar(150) not null,
  description text not null, category varchar(50) not null,
  min_age integer not null, max_age integer not null, duration_minutes integer not null,
  materials text[] not null, steps text[] not null, parent_tips text,
  variations text, learning_goal text, created_at timestamptz default current_timestamp
);
create table if not exists public.activity_logs (
  id uuid primary key default gen_random_uuid(),
  child_id uuid references public.children(id) on delete cascade,
  activity_id uuid references public.activities(id) on delete cascade,
  status varchar(30) default 'planned', scheduled_date date default current_date,
  completed_at timestamptz, created_at timestamptz default current_timestamp
);
create table if not exists public.journal_entries (
  id uuid primary key default gen_random_uuid(),
  child_id uuid references public.children(id) on delete cascade,
  activity_id uuid references public.activities(id) on delete set null,
  entry_date date default current_date, notes text not null, engagement_level varchar(30),
  milestone_tag varchar(100), photo_url text, created_at timestamptz default current_timestamp
);
create table if not exists public.milestones (
  id uuid primary key default gen_random_uuid(),
  child_id uuid references public.children(id) on delete cascade, milestone_key text,
  domain varchar(50) not null, age_group varchar(50) not null, description text not null,
  description_en text, is_achieved boolean not null default false, achieved_at timestamptz,
  created_at timestamptz default current_timestamp
);
alter table public.milestones
  add column if not exists child_id uuid references public.children(id) on delete cascade,
  add column if not exists milestone_key text, add column if not exists description_en text,
  add column if not exists is_achieved boolean not null default false,
  add column if not exists achieved_at timestamptz;
create unique index if not exists milestones_child_key_idx
  on public.milestones(child_id, milestone_key)
  where child_id is not null and milestone_key is not null;
alter table public.milestones enable row level security;
drop policy if exists "Milestones are readable" on public.milestones;
drop policy if exists "Parents can read their children's milestones" on public.milestones;
create policy "Parents can read their children's milestones"
  on public.milestones for select to anon, authenticated using (
    child_id is null or exists (
      select 1 from public.children c join public.parents p on p.id = c.parent_id
      where c.id = milestones.child_id and lower(p.email) = lower(auth.jwt() ->> 'email')
    )
  );
drop policy if exists "Parents can add their children's milestones" on public.milestones;
create policy "Parents can add their children's milestones"
  on public.milestones for insert to authenticated with check (
    child_id is not null and exists (
      select 1 from public.children c join public.parents p on p.id = c.parent_id
      where c.id = milestones.child_id and lower(p.email) = lower(auth.jwt() ->> 'email')
    )
  );
drop policy if exists "Parents can update their children's milestones" on public.milestones;
create policy "Parents can update their children's milestones"
  on public.milestones for update to authenticated using (
    child_id is not null and exists (
      select 1 from public.children c join public.parents p on p.id = c.parent_id
      where c.id = milestones.child_id and lower(p.email) = lower(auth.jwt() ->> 'email')
    )
  ) with check (
    child_id is not null and exists (
      select 1 from public.children c join public.parents p on p.id = c.parent_id
      where c.id = milestones.child_id and lower(p.email) = lower(auth.jwt() ->> 'email')
    )
  );
grant select on public.milestones to anon, authenticated;
grant insert, update on public.milestones to authenticated;
alter table public.parents enable row level security;
drop policy if exists "Parents can read their own profile" on public.parents;
create policy "Parents can read their own profile"
  on public.parents for select to authenticated
  using (lower(email) = lower(auth.jwt() ->> 'email'));
drop policy if exists "Parents can create their own profile" on public.parents;
create policy "Parents can create their own profile"
  on public.parents for insert to authenticated
  with check (
    id = auth.uid()
    and lower(email) = lower(auth.jwt() ->> 'email')
  );
grant select, insert on public.parents to authenticated;
`;

        navigator.clipboard.writeText(sql);
        showToast(lang === 'id' ? '📋 Skema SQL berhasil disalin!' : '📋 SQL schema copied to clipboard!');
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-xl w-full p-6 sm:p-8 shadow-2xl border border-stone-200 space-y-6 max-h-[90vh] overflow-y-auto custom-scroll">
            
            {/* Header Modal */}
            <div className="flex items-start justify-between border-b border-stone-100 pb-4">
              <div className="flex items-center gap-3">
                <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center border border-emerald-100 font-bold text-xl">
                  ⚡
                </div>
                <div>
                  <h3 className="font-display font-bold text-xl text-slate-900">
                    {lang === 'id' ? 'Koneksi Database Supabase' : 'Supabase Database Connection'}
                  </h3>
                  <p className="text-xs text-stone-500 font-medium">
                    {lang === 'id' ? 'Simpan jurnal observasi & sinkronisasi data langsung ke cloud' : 'Persist observation journals & sync data directly to cloud'}
                  </p>
                </div>
              </div>
              <button 
                onClick={onClose}
                className="text-stone-400 hover:text-stone-700 p-2 rounded-xl hover:bg-stone-100 transition"
              >
                ✕
              </button>
            </div>

            {/* Status Badge */}
            <div className="p-4 rounded-2xl bg-stone-50 border border-stone-200/80 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className={`w-3 h-3 rounded-full ${
                  sbStatus === 'connected' ? 'bg-emerald-500 animate-pulse' :
                  sbStatus === 'checking' ? 'bg-amber-400 animate-bounce' :
                  sbStatus === 'error' ? 'bg-rose-500' : 'bg-stone-400'
                }`}></span>
                <span className="text-xs font-bold text-slate-800">
                  {lang === 'id' ? 'Status Saat Ini: ' : 'Current Status: '}
                  <span className={`font-extrabold ${
                    sbStatus === 'connected' ? 'text-emerald-600' :
                    sbStatus === 'error' ? 'text-rose-600' : 'text-stone-600'
                  }`}>
                    {sbStatus === 'connected' ? (lang === 'id' ? 'Terhubung (Online)' : 'Connected (Online)') :
                     sbStatus === 'checking' ? (lang === 'id' ? 'Memeriksa...' : 'Checking...') :
                     sbStatus === 'error' ? (lang === 'id' ? 'Gagal Terhubung' : 'Connection Error') :
                     (lang === 'id' ? 'Mode Demo Lokal (Belum Terhubung)' : 'Local Demo Mode (Not Connected)')}
                  </span>
                </span>
              </div>

              {sbStatus === 'connected' && (
                <button
                  type="button"
                  onClick={onDisconnect}
                  className="text-xs font-bold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition"
                >
                  {lang === 'id' ? 'Putuskan' : 'Disconnect'}
                </button>
              )}
            </div>

            {/* Form Input URL & Key */}
            <form onSubmit={handleTestAndSave} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                  Supabase Project URL
                </label>
                <input 
                  type="url" 
                  value={urlInput}
                  onChange={(e) => setUrlInput(e.target.value)}
                  placeholder="https://your-project-id.supabase.co"
                  className="w-full px-4 py-2.5 text-xs font-medium rounded-xl border border-stone-300 focus:outline-hidden focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 font-mono"
                  required
                />
                <span className="text-[10px] text-stone-500 block mt-1">
                  {lang === 'id' ? 'Ditemukan di: Supabase Dashboard > Project Settings > API > Project URL' : 'Find at: Supabase Dashboard > Project Settings > API > Project URL'}
                </span>
              </div>

              <div>
                <label className="block text-xs font-bold text-slate-700 mb-1.5">
                  Supabase Anon / Public API Key
                </label>
                <input 
                  type="password" 
                  value={keyInput}
                  onChange={(e) => setKeyInput(e.target.value)}
                  placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  className="w-full px-4 py-2.5 text-xs font-medium rounded-xl border border-stone-300 focus:outline-hidden focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-600 font-mono"
                  required
                />
                <span className="text-[10px] text-stone-500 block mt-1">
                  {lang === 'id' ? 'Ditemukan di: Supabase Dashboard > Project Settings > API > Project API keys (anon / public)' : 'Find at: Supabase Dashboard > Project Settings > API > Project API keys (anon / public)'}
                </span>
              </div>

              {testMessage && (
                <div className={`p-3 rounded-xl text-xs font-medium ${
                  testMessage.type === 'success' ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' :
                  testMessage.type === 'warning' ? 'bg-amber-50 text-amber-800 border border-amber-200' :
                  'bg-rose-50 text-rose-800 border border-rose-200'
                }`}>
                  {testMessage.text}
                </div>
              )}

              <div className="flex items-center gap-3 pt-2">
                <button
                  type="submit"
                  disabled={testing}
                  className="flex-1 py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20 transition disabled:opacity-50 flex items-center justify-center gap-2 cursor-pointer"
                >
                  {testing ? (
                    <span>⏳ {lang === 'id' ? 'Menguji Koneksi...' : 'Testing Connection...'}</span>
                  ) : (
                    <span>💾 {lang === 'id' ? 'Simpan & Hubungkan' : 'Save & Connect'}</span>
                  )}
                </button>

                {sbStatus === 'connected' && (
                  <button
                    type="button"
                    onClick={onSeedData}
                    className="py-3 px-4 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold text-xs transition cursor-pointer"
                    title={lang === 'id' ? 'Sinkronkan katalog aktivitas saja' : 'Sync the activity catalog only'}
                  >
                    🚀 {lang === 'id' ? 'Sinkron Katalog Aktivitas' : 'Sync Activity Catalog'}
                  </button>
                )}
              </div>
            </form>

            {/* Panduan Skema SQL Supabase */}
            <div className="border-t border-stone-200/80 pt-4 space-y-3">
              <div className="flex items-center justify-between">
                <div>
                  <h4 className="text-xs font-bold text-slate-800">
                    {lang === 'id' ? 'Belum Buat Tabel di Supabase?' : 'Need to Create Supabase Tables?'}
                  </h4>
                  <p className="text-[11px] text-stone-500">
                    {lang === 'id' ? 'Jalankan skrip SQL di Supabase SQL Editor. File "supabase_schema.sql" sudah dibuat di workspace Anda.' : 'Run the SQL script in Supabase SQL Editor. File "supabase_schema.sql" is already in your workspace.'}
                  </p>
                </div>
                <button
                  type="button"
                  onClick={copySqlSchema}
                  className="px-3 py-1.5 rounded-lg bg-sage-50 text-sage-700 hover:bg-sage-100 font-bold text-xs border border-sage-200 transition shrink-0 cursor-pointer"
                >
                  📋 {lang === 'id' ? 'Salin SQL' : 'Copy SQL'}
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // Render ke Root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

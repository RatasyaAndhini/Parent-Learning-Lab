    async function fetchSupabaseTable(client, tableName) {
      if (!client) {
        return { data: [], error: new Error('Supabase client tidak tersedia.') };
      }

      try {
        const { data, error } = await client.from(tableName).select('*');
        if (error) {
          console.error(`Gagal mengambil data tabel ${tableName}:`, error);
          return { data: [], error };
        }
        return { data: data || [], error: null };
      } catch (error) {
        console.error(`Gagal mengambil data tabel ${tableName}:`, error);
        return { data: [], error };
      }
    }

      const result = await fetchSupabaseTable(client, 'activities');

      return result;

    const activityTitleKey = title => String(title || '').trim().toLocaleLowerCase();

    function mapDatabaseActivity(row) {
      const localActivity = ACTIVITIES_DATA.find(activity =>
        activityTitleKey(activity.title.id) === activityTitleKey(row.title) ||
        activityTitleKey(activity.title.en) === activityTitleKey(row.title)
      );
      const titleId = localActivity?.title.id || row.title || '';
      const titleEn = localActivity?.title.en || row.title || '';
      const listValue = value => Array.isArray(value) ? value : [];
      const textValue = value => typeof value === 'string' ? value : '';

      return {
        ...(localActivity || {}),
        id: localActivity?.id || row.id,
        databaseId: row.id,
        category: row.category,
        minAge: Number(row.min_age) || localActivity?.minAge || 2,

        focus: localActivity?.focus || { id: row.learning_goal || '', en: row.learning_goal || '' },
        title: { id: titleId, en: titleEn },
        description: {
          id: textValue(row.description) || localActivity?.description.id || '',
          en: localActivity?.description.en || textValue(row.description) || ''
        },
        materials: {
          id: listValue(row.materials).length ? listValue(row.materials) : localActivity?.materials.id || [],
          en: localActivity?.materials.en || listValue(row.materials)
        },
        steps: {
          id: listValue(row.steps).length ? listValue(row.steps) : localActivity?.steps.id || [],

    }

    async function loadOrSeedActivities(client, allowSeed = false) {
      const current = await fetchActivities(client);
      if (current.error) throw current.error;
      if (current.data.length) return current.data.map(mapDatabaseActivity);
      if (!allowSeed) return [];

      const rowsToSeed = ACTIVITIES_DATA
        .filter(activity => LOCAL_ACTIVITY_GUIDE_IMAGES[activity.id])
        .map(activity => ({
        title: activity.title.id,
        description: activity.description.id,
        category: activity.category,
        min_age: activity.minAge,
        max_age: activity.maxAge,
        duration_minutes: activity.duration,
        materials: activity.materials.id,
        steps: activity.steps.id,
        parent_tips: activity.parentingTips.id,
        variations: '',
        learning_goal: activity.milestones.id
      }));
      const { data, error } = await client
        .from('activities')
        .insert(rowsToSeed)
        .select('id,title,description,category,min_age,max_age,duration_minutes,materials,steps,parent_tips,variations,learning_goal');
      if (error) {
        console.error('Gagal mengisi pustaka aktivitas awal ke Supabase:', error);
        throw error;
      }
      console.info('Pustaka aktivitas awal tersimpan ke Supabase:', data.length);
      return data.map(mapDatabaseActivity);
    }

    function calculateAge(birthDate) {
      if (!birthDate) return 0;
      const birth = new Date(`${birthDate}T00:00:00`);
      if (Number.isNaN(birth.getTime())) return 0;
      const today = new Date();
      let age = today.getFullYear() - birth.getFullYear();
      if (today.getMonth() < birth.getMonth() ||
          (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age -= 1;
      return Math.max(0, age);
    }

    function getMilestoneAgeGroup(age) {
      if (age <= 3) return MILESTONE_AGE_GROUPS[0];
      if (age <= 5) return MILESTONE_AGE_GROUPS[1];
      if (age <= 8) return MILESTONE_AGE_GROUPS[2];
      return MILESTONE_AGE_GROUPS[3];
    }

    function createMilestoneRows(child) {
      const ageGroup = getMilestoneAgeGroup(Number(child?.age) || 2);
      return ageGroup.categories.flatMap(category => category.milestones.map(([key, id, en]) => ({
        milestone_key: `${ageGroup.id}-${key}`,
        domain: category.domain,
        age_group: ageGroup.label.id,
        description: id,
        description_en: en,
        is_achieved: false,
        achieved_at: null
      })));
    }

    const MILESTONE_REVIEW_PREFIX = '__PARENT_REVIEW__:';

    function readMilestoneReview(row) {
      const englishDescription = String(row.description_en || '');
      if (englishDescription.startsWith(MILESTONE_REVIEW_PREFIX)) {
        try {
          const review = JSON.parse(englishDescription.slice(MILESTONE_REVIEW_PREFIX.length));
          return {
            englishDescription: review.englishDescription || row.description,
            assessment_level: ['not_observed', 'developing', 'independent'].includes(review.assessment_level)
              ? review.assessment_level
              : (row.is_achieved ? 'independent' : 'not_observed'),
            parent_note: typeof review.parent_note === 'string' ? review.parent_note : ''
          };
        } catch (error) {
          console.warn('Metadata penilaian milestone tidak valid:', error);
        }
      }
      return {
        englishDescription: englishDescription || row.description,
        assessment_level: ['not_observed', 'developing', 'independent'].includes(row.assessment_level)
          ? row.assessment_level
          : (row.is_achieved ? 'independent' : 'not_observed'),
        parent_note: typeof row.parent_note === 'string' ? row.parent_note : ''
      };
    }

    function writeMilestoneReview(row, assessmentLevel, parentNote) {
      const review = readMilestoneReview(row);
      return `${MILESTONE_REVIEW_PREFIX}${JSON.stringify({
        englishDescription: review.englishDescription,
        assessment_level: assessmentLevel,
        parent_note: parentNote
      })}`;
    }

    function getMilestoneAssessmentScore(row) {
      const level = readMilestoneReview(row).assessment_level;
      return level === 'independent' ? 100 : level === 'developing' ? 50 : 0;
    }

    async function getOrCreateParentProfile(client, user, lang, parentName) {
      const email = user.email;
      const { data: existingProfile, error: profileLookupError } = await client
        .from('parents')
        .select('id,name,email')
        .ilike('email', email)
        .maybeSingle();
      if (profileLookupError) {
        throw new Error((lang === 'id' ? 'Gagal membaca profil parents: ' : 'Could not read the parents profile: ') + profileLookupError.message);
      }
      if (existingProfile) return existingProfile;

      const metadataName = parentName || user.user_metadata?.full_name || user.user_metadata?.name;
      const emailName = email.split('@')[0].replace(/[._-]+/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
      const { data: createdProfile, error: profileInsertError } = await client
        .from('parents')
        .insert([{
          id: user.id,
          name: metadataName || emailName || email,
          email,
          password_hash: 'managed-by-supabase-auth'
        }])
        .select('id,name,email')
        .single();
      if (!profileInsertError) return createdProfile;

      if (profileInsertError.code === '23505') {
        const { data: racedProfile, error: racedLookupError } = await client
          .from('parents')
          .select('id,name,email')
          .ilike('email', email)
          .maybeSingle();
        if (!racedLookupError && racedProfile) return racedProfile;
      }

      if (profileInsertError.code === '42501') {
        throw new Error(lang === 'id'
          ? 'Login berhasil, tetapi Supabase menolak pembuatan profil karena policy RLS parents belum sesuai. Buka Supabase Dashboard > SQL Editor, jalankan ulang bagian policy/grant untuk public.parents dari supabase_schema.sql, lalu coba masuk lagi. Detail: ' + profileInsertError.message
          : 'Sign-in succeeded, but Supabase blocked profile creation because the parents RLS policy is missing or outdated. Open Supabase Dashboard > SQL Editor, re-run the policy/grant section for public.parents from supabase_schema.sql, then sign in again. Details: ' + profileInsertError.message);
      }

      throw new Error((lang === 'id'
        ? 'Akun Auth berhasil, tetapi profil orang tua gagal dibuat di parents: '
        : 'Auth succeeded, but the parent profile could not be created in parents: ') + profileInsertError.message);
    }

    async function saveJournalEntry(newJournal, client) {
      if (!client) {
        console.error('Gagal menyimpan jurnal: Supabase client tidak tersedia.');
        return { ok: false };
      }

      const metadata = JSON.stringify({
        category: newJournal.category,
        activityTitle: newJournal.activityTitle,
        focusMinutes: newJournal.focusMinutes,
        engagement: newJournal.engagement,
        tag: newJournal.tag
      });
      const journalRow = {
        child_id: newJournal.childId,
        activity_id: newJournal.activityId || null,
        notes: `${newJournal.notes || ''}\n\n[[parent-companion-v1:${metadata}]]`,
        engagement_level: newJournal.engagement >= 4 ? 'senang' : newJournal.engagement === 3 ? 'butuh_bantuan' : 'menantang',
        entry_date: new Date().toISOString().split('T')[0],
        milestone_tag: newJournal.tag
      };
      const { data, error } = await client
        .from('journal_entries')
        .insert([journalRow])
        .select('id, child_id, activity_id, entry_date, notes, engagement_level, milestone_tag')
        .single();
      if (error) {
        console.error('Gagal menyimpan jurnal:', error);
        return { ok: false };
      }

      let activityLogError = null;
      if (newJournal.activityId) {
        const { error: logError } = await client.from('activity_logs').insert([{
          child_id: newJournal.childId,
          activity_id: newJournal.activityId,
          status: 'completed',
          scheduled_date: journalRow.entry_date,
          completed_at: new Date().toISOString()
        }]);
        if (logError) {
          console.error('Jurnal tersimpan, tetapi log aktivitas gagal disimpan:', logError);
          activityLogError = logError;
        }
      }
      console.info('Jurnal tersimpan ke Supabase:', data.id);
      return { ok: true, journal: data, activityLogError };
    }

    function parseJournalNotes(rawNotes) {
      const marker = /\n\n\[\[parent-companion-v1:(\{.*\})\]\]$/s;
      const match = marker.exec(rawNotes || '');
      if (!match) return { notes: rawNotes || '', metadata: {} };

      try {
        return {
          notes: rawNotes.slice(0, match.index),
          metadata: JSON.parse(match[1])
        };
      } catch (error) {
        console.warn('Metadata jurnal tersimpan tidak dapat dibaca:', error);
        return { notes: rawNotes || '', metadata: {} };
      }
    }

    function createTalentSummary(journals, lang) {
      const categories = ['Montessori', 'STEM', 'Literasi', 'Numerasi'];
      const stats = categories.map(category => {
        const entries = journals.filter(entry => entry.category === category);
        return {
          category,
          count: entries.length,
          averageEngagement: entries.length
            ? entries.reduce((sum, entry) => sum + Number(entry.engagement || 0), 0) / entries.length
            : 0,
          averageFocus: entries.length
            ? entries.reduce((sum, entry) => sum + Number(entry.focusMinutes || 0), 0) / entries.length
            : 0
        };
      });
      const played = [...stats].sort((a, b) => b.count - a.count)[0];
      const rated = [...stats].filter(item => item.count).sort((a, b) => b.averageEngagement - a.averageEngagement)[0];
      const focusEntries = journals.filter(entry => Number(entry.focusMinutes) > 0);
      const focusAverage = focusEntries.length

        .map(area => ({ ...area, score: area.keys.reduce((sum, key) => sum + (notes.includes(key) ? 1 : 0), 0) }))

    // ====================================================================
    // ROOT APPLICATION COMPONENT
    // ====================================================================
    function App() {
      // Bahasa State: 'id' | 'en'
      const [lang, setLang] = useState('id');
      const t = I18N[lang];

      // KETENTUAN UTAMA: HARUS DIMULAI DARI HALAMAN LOGIN
      const [currentScreen, setCurrentScreen] = useState('login'); // 'login' | 'app'
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'library' | 'journal'
      // Supabase State & Config
      const [sbConfig, setSbConfig] = useState(getStoredSupabaseConfig);
      const [sbClient, setSbClient] = useState(() => (
        sbConfig.url === SUPABASE_URL && sbConfig.anonKey === SUPABASE_KEY
          ? initialSupabaseClient
          : createSupabaseClientInstance(sbConfig.url, sbConfig.anonKey)
      ));
      const [sbStatus, setSbStatus] = useState(() => (sbConfig.url && sbConfig.anonKey ? 'checking' : 'disconnected'));
      const [isSbModalOpen, setIsSbModalOpen] = useState(false);
      const [databaseActivities, setDatabaseActivities] = useState([]);
      const [databaseMilestones, setDatabaseMilestones] = useState([]);
      const [currentParent, setCurrentParent] = useState(null);
      const [databaseChildren, setDatabaseChildren] = useState([]);
      const [activeChildId, setActiveChildId] = useState(null);
      const [journals, setJournals] = useState([]);
      const [childMilestones, setChildMilestones] = useState([]);
      const [milestonesLoading, setMilestonesLoading] = useState(false);
      const [milestoneSavingIds, setMilestoneSavingIds] = useState([]);
      const [completedActivityIds, setCompletedActivityIds] = useState([]);
      const [isLocalSession, setIsLocalSession] = useState(false);
      const activeChild = databaseChildren.find(child => child.id === activeChildId) || databaseChildren[0] || null;
      const appActivities = (databaseActivities.length ? databaseActivities : ACTIVITIES_DATA)
        .filter(activity => activity.localGuideImages);

      // Activities and milestones are public catalog data; parent data is fetched only after authentication.
      useEffect(() => {
        if (!sbClient) {
          setSbStatus('disconnected');
          return;
        }

        let isMounted = true;
        const fetchRemoteData = async () => {
          setSbStatus('checking');
          try {
            const [activitiesResult, milestonesResult] = await Promise.all([
              loadOrSeedActivities(sbClient),
              fetchSupabaseTable(sbClient, 'milestones')
            ]);
            if (isMounted) {
              setDatabaseActivities(activitiesResult);
              setDatabaseMilestones(milestonesResult.data);
              setSbStatus(milestonesResult.error ? 'error' : 'connected');
              console.info('Katalog Supabase dimuat:', {
                activities: activitiesResult.length,
                milestones: milestonesResult.data.length
              });
            }
          } catch (err) {
            console.error('Gagal memuat katalog Supabase:', err);
            if (isMounted) {
              setSbStatus('error');
            }
          }
        };

        fetchRemoteData();
        return () => { isMounted = false; };
      }, [sbClient]);

      useEffect(() => {
        if (!sbClient || !currentParent || !activeChild || isLocalSession) return undefined;
        let isMounted = true;
        const fetchChildProgress = async () => {
          const [journalResult, logsResult] = await Promise.all([
            sbClient
              .from('journal_entries')
              .select('id,child_id,activity_id,entry_date,notes,engagement_level,milestone_tag,photo_url')
              .eq('child_id', activeChild.id)
              .order('entry_date', { ascending: false }),
            sbClient
              .from('activity_logs')
              .select('id,child_id,activity_id,status,scheduled_date,completed_at')
              .eq('child_id', activeChild.id)
          ]);

          if (journalResult.error || logsResult.error) {
            console.error('Gagal memuat jurnal atau log aktivitas:', journalResult.error || logsResult.error);
            if (isMounted) setSbStatus('error');
            return;
          }

          if (!isMounted) return;
          const formattedJournals = journalResult.data.map(entry => {
            const parsedNotes = parseJournalNotes(entry.notes);
            const metadata = parsedNotes.metadata;
            const relatedActivity = databaseActivities.find(activity =>
              activity.databaseId === entry.activity_id
            );
            const engagementFromSchema = {
              senang: 5,
              butuh_bantuan: 3,
              menantang: 2
            }[String(entry.engagement_level || '').toLowerCase()] || 0;
            const entryDate = entry.entry_date ? new Date(`${entry.entry_date}T00:00:00`) : new Date();
            const localizedDate = entryDate.toLocaleDateString(lang === 'id' ? 'id-ID' : 'en-US');
            return {
              id: entry.id,
              childId: entry.child_id,
              activityId: entry.activity_id,
              activityTitle: metadata.activityTitle || relatedActivity?.title[lang] || (lang === 'id' ? 'Catatan Observasi' : 'Observation Note'),
              date: localizedDate,
              dateEn: localizedDate,
              engagement: Number(metadata.engagement) || engagementFromSchema,
              notes: parsedNotes.notes,
              notesEn: parsedNotes.notes,
              category: metadata.category || relatedActivity?.category || 'Montessori',
              focusMinutes: Number(metadata.focusMinutes) || 0,
              tag: entry.milestone_tag || metadata.tag || (lang === 'id' ? 'Observasi' : 'Observation')
            };
          });
          const completedIds = logsResult.data
            .filter(log => log.status === 'completed')
            .map(log => databaseActivities.find(activity => activity.databaseId === log.activity_id)?.id || log.activity_id);
          setJournals(formattedJournals);
          setCompletedActivityIds(completedIds);
        };

        fetchChildProgress().catch(error => {
          console.error('Gagal memuat progres anak dari Supabase:', error);
          if (isMounted) setSbStatus('error');
        });
        return () => { isMounted = false; };
      }, [sbClient, currentParent?.id, activeChild?.id, databaseActivities, lang, isLocalSession]);

      useEffect(() => {
        if (!currentParent || !activeChild) {
          setChildMilestones([]);
          setMilestonesLoading(false);
          return undefined;
        }

        if (isLocalSession) {
          try {
            const storageKey = `${LOCAL_MILESTONES_STORAGE_KEY}:${activeChild.id}`;
            const stored = localStorage.getItem(storageKey);
            const initialRows = createMilestoneRows(activeChild).map((milestone, index) => ({
              ...milestone,
              id: `local:${milestone.milestone_key}`,
              child_id: activeChild.id
            }));
            const storedRows = stored === null ? [] : JSON.parse(stored);
            if (!Array.isArray(storedRows)) throw new Error('Format milestones lokal tidak valid.');
            const currentKeys = new Set(initialRows.map(row => row.milestone_key));
            const currentRows = storedRows.filter(row => currentKeys.has(row.milestone_key));
            const savedRows = initialRows.map(row =>
              currentRows.find(saved => saved.milestone_key === row.milestone_key) || row
            );
            localStorage.setItem(storageKey, JSON.stringify([...storedRows.filter(row => !currentKeys.has(row.milestone_key)), ...savedRows]));
            setChildMilestones(savedRows);
          } catch (error) {
            console.error('Gagal memuat milestones lokal:', error);
            setChildMilestones([]);
            showToast(lang === 'id'
              ? 'Checklist lokal tidak dapat dibaca. Periksa izin penyimpanan browser.'
              : 'Local milestones could not be read. Check browser storage permissions.');
          }
          setMilestonesLoading(false);
          return undefined;
        }

        if (!sbClient) {
          setChildMilestones([]);
          setMilestonesLoading(false);
          return undefined;
        }

        let isMounted = true;
        const loadMilestones = async () => {
          setMilestonesLoading(true);
          try {
            const columns = 'id,child_id,milestone_key,domain,age_group,description,description_en,is_achieved,achieved_at';
            const fetchRows = () => sbClient
              .from('milestones')
              .select(columns)
              .eq('child_id', activeChild.id)
              .order('domain', { ascending: true })
              .order('milestone_key', { ascending: true });

            let { data, error } = await fetchRows();
            if (error) throw error;

            const expectedRows = createMilestoneRows(activeChild);
            const expectedKeys = new Set(expectedRows.map(row => row.milestone_key));
            const existingKeys = new Set((data || []).map(row => row.milestone_key));
            const missingRows = expectedRows
              .filter(row => !existingKeys.has(row.milestone_key))
              .map(row => ({ ...row, child_id: activeChild.id }));
            if (missingRows.length) {
              const seeded = await sbClient.from('milestones').insert(missingRows).select(columns);
              if (seeded.error && seeded.error.code !== '23505') throw seeded.error;
              if (seeded.error?.code === '23505') {
                ({ data, error } = await fetchRows());
                if (error) throw error;
              } else {
                data = [...(data || []), ...(seeded.data || [])];
              }
            }

            if (isMounted) setChildMilestones((data || []).filter(row => expectedKeys.has(row.milestone_key)));
          } catch (error) {
            console.error('Gagal memuat milestones anak dari Supabase:', error);
            if (isMounted) {
              setChildMilestones([]);
              showToast(lang === 'id'
                ? 'Milestones Supabase belum siap. Jalankan pembaruan skema milestones dari supabase_schema.sql di SQL Editor.'
                : 'Supabase milestones are not ready. Run the milestones schema update from supabase_schema.sql in SQL Editor.');
            }
          } finally {
            if (isMounted) setMilestonesLoading(false);
          }
        };

        loadMilestones();
        return () => { isMounted = false; };
      }, [sbClient, currentParent?.id, activeChild?.id, activeChild?.age, isLocalSession, lang]);

      // Handler Pengaturan Supabase
      const handleSaveSbConfig = (url, anonKey) => {
        const newCfg = { url, anonKey };
        localStorage.setItem(SUPABASE_STORAGE_KEY, JSON.stringify(newCfg));
        setSbConfig(newCfg);
        if (sbClient && sbConfig.url === url && sbConfig.anonKey === anonKey) {
          setSbStatus('connected');
          return;
        }
        const client = createSupabaseClientInstance(url, anonKey);
        setSbClient(client);
        setSbStatus(client ? 'checking' : 'disconnected');
      };

      const handleLogin = async (email, password, parentName) => {
        if (!sbClient) {
          throw new Error(lang === 'id' ? 'Supabase belum tersambung.' : 'Supabase is not connected.');
        }
        const { data: authData, error: authError } = await sbClient.auth.signInWithPassword({ email, password });
        if (authError) {
          const invalidCredentials = authError.code === 'invalid_credentials' ||
            /invalid login credentials/i.test(authError.message || '');
          if (invalidCredentials) {
            throw new Error(lang === 'id'
              ? 'Email atau kata sandi tidak cocok dengan akun Supabase Auth. Data di kolom parents.password_hash tidak digunakan untuk login. Buat/undang akun dengan email ini di Supabase Dashboard > Authentication, lalu gunakan kata sandi Auth tersebut.'
              : 'The email or password does not match a Supabase Auth account. The parents.password_hash column is not used for sign-in. Create/invite this email in Supabase Dashboard > Authentication, then use that Auth password.');
          }
          throw authError;
        }
        const authenticatedEmail = authData.user?.email;
        if (!authenticatedEmail) {
          await sbClient.auth.signOut();
          throw new Error(lang === 'id' ? 'Email akun tidak ditemukan.' : 'The account email was not returned.');
        }

        let parentRecord;
        try {
          parentRecord = await getOrCreateParentProfile(sbClient, authData.user, lang, parentName);
        } catch (parentError) {
          await sbClient.auth.signOut();
          throw parentError;
        }

        const { data: childRows, error: childrenError } = await sbClient
          .from('children')
          .select('id,parent_id,nickname,birth_date,interests,learning_focus,available_time')
          .eq('parent_id', parentRecord.id);
        if (childrenError) {
          await sbClient.auth.signOut();
          throw childrenError;
        }
        if (!childRows?.length) {
          await sbClient.auth.signOut();
          throw new Error(lang === 'id'
            ? 'Profil orang tua berhasil ditemukan/dibuat, tetapi belum ada anak di children dengan parent_id yang sama. Tambahkan profil anak lalu coba masuk lagi.'
            : 'The parent profile was found/created, but no child in children has the matching parent_id. Add a child profile and sign in again.');
        }

        let catalog;
        try {
          catalog = await loadOrSeedActivities(sbClient, true);
        } catch (catalogError) {
          await sbClient.auth.signOut();
          throw catalogError;
        }

        const mappedChildren = childRows.map(mapDatabaseChild);
        setCurrentParent({
          id: parentRecord.id,
          name: parentRecord.name,

          children: mappedChildren,
          streakDays: 0,
          totalMinutes: 0,
          completedIds: []
        });

        setDatabaseChildren(mappedChildren);
        setActiveChildId(childRows[0].id);
        setJournals([]);
        setCompletedActivityIds([]);

        setCurrentScreen('app');
        showToast(lang === 'id' ? `Selamat datang, ${parentRecord.name}` : `Welcome, ${parentRecord.name}`);
      };

      const handleLocalLogin = () => {
        const childId = 'local-demo-child';

          {
            id: 'local-seed-1', childId, activityId: null,

          },
          {

            activityTitle: lang === 'id' ? 'Jembatan Kertas Penahan Beban' : 'Load-Bearing Paper Bridge',

            engagement: 4, focusMinutes: 15,

            notesEn: 'Counted toy fruits while pretending to be a shopkeeper.',
            category: 'Numerasi', tag: lang === 'id' ? 'Berhitung' : 'Counting'
          }

        let localJournals = sampleJournals;
        try {
          const storedJournals = localStorage.getItem(LOCAL_JOURNAL_STORAGE_KEY);
          if (storedJournals !== null) {
            const parsedJournals = JSON.parse(storedJournals);
            if (!Array.isArray(parsedJournals)) throw new Error('Format jurnal lokal tidak valid.');
            localJournals = parsedJournals;
          } else {
            localStorage.setItem(LOCAL_JOURNAL_STORAGE_KEY, JSON.stringify(sampleJournals));

        } catch (error) {
          console.error('Gagal memuat jurnal sesi lokal:', error);

          age: 5,

          dailyTime: 20
        };
        setIsLocalSession(true);
        setCurrentParent({
          id: 'local-demo-parent',
          name: 'Bunda Rina Pratiwi',
          email: 'rina.lokal@example.test',
          avatar: 'RP',
          color: 'bg-sage-600',
          children: [localChild],
          streakDays: 3,
          totalMinutes: localJournals.reduce((total, entry) => total + Number(entry.focusMinutes || 0), 0),
          completedIds: []
        });
        setDatabaseChildren([localChild]);
        setActiveChildId(childId);
        setJournals(localJournals);
        setCompletedActivityIds([]);
        setActiveTab('dashboard');
        setCurrentScreen('app');
        showToast(lang === 'id' ? 'Masuk dengan data lokal. Jurnal disimpan di browser ini.' : 'Signed in with local data. Journals are saved in this browser.');
      };

      const handleAssessMilestone = async (milestone, assessmentLevel, parentNote) => {
        const isAchieved = assessmentLevel === 'independent';
        const achievedAt = isAchieved
          ? (milestone.achieved_at || new Date().toISOString())
          : null;
        const encodedDescription = writeMilestoneReview(milestone, assessmentLevel, parentNote);
        const updatedMilestone = {
          ...milestone,
          description_en: encodedDescription,
          assessment_level: assessmentLevel,
          parent_note: parentNote,
          is_achieved: isAchieved,
          achieved_at: achievedAt
        };

        if (isLocalSession) {
          try {
            const updatedRows = childMilestones.map(row =>
              row.milestone_key === milestone.milestone_key
                ? updatedMilestone
                : row
            );
            localStorage.setItem(
              `${LOCAL_MILESTONES_STORAGE_KEY}:${activeChild.id}`,
              JSON.stringify(updatedRows)
            );
            setChildMilestones(updatedRows);
          } catch (error) {
            console.error('Gagal menyimpan milestone lokal:', error);
            showToast(lang === 'id'
              ? 'Milestone lokal gagal disimpan. Periksa ruang dan izin penyimpanan browser.'
              : 'Local milestone could not be saved. Check browser storage space and permissions.');
          }
          return;
        }

        if (!sbClient || !activeChild) {
          showToast(lang === 'id' ? 'Profil anak atau koneksi Supabase tidak tersedia.' : 'The child profile or Supabase connection is unavailable.');
          return;
        }

        setMilestoneSavingIds(current => [...new Set([...current, milestone.id])]);
        try {
          const { data, error } = await sbClient
            .from('milestones')
            .update({
              is_achieved: isAchieved,
              achieved_at: achievedAt,
              description_en: encodedDescription
            })
            .eq('id', milestone.id)
            .eq('child_id', activeChild.id)
            .select('id,child_id,milestone_key,domain,age_group,description,description_en,is_achieved,achieved_at')
            .single();
          if (error || !data) throw error || new Error('Updated milestone row was not returned.');
          const review = readMilestoneReview(data);
          setChildMilestones(rows => rows.map(row => row.id === data.id
            ? { ...data, assessment_level: review.assessment_level, parent_note: review.parent_note }
            : row));
        } catch (error) {
          console.error('Gagal memperbarui milestone di Supabase:', error);
          showToast(lang === 'id'
            ? 'Penilaian gagal disimpan. Periksa izin update dan kolom milestones di Supabase.'
            : 'The assessment could not be saved. Check Supabase milestone update permissions and columns.');
        } finally {
          setMilestoneSavingIds(current => current.filter(id => id !== milestone.id));
        }
      };

      const handleDisconnectSb = async () => {
        if (sbClient) {
          const { error } = await sbClient.auth.signOut();
          if (error) console.error('Gagal mengakhiri sesi Supabase Auth:', error);
        }
        localStorage.setItem(SUPABASE_STORAGE_KEY, JSON.stringify({ url: '', anonKey: '' }));
        setSbConfig({ url: '', anonKey: '' });
        setSbClient(null);
        setSbStatus('disconnected');
        setDatabaseActivities([]);
        setCurrentParent(null);
        setDatabaseChildren([]);
        setActiveChildId(null);
        setJournals([]);
        setChildMilestones([]);
        setCompletedActivityIds([]);
        setIsLocalSession(false);
        setCurrentScreen('login');
        showToast(lang === 'id' ? 'Koneksi Supabase diputuskan.' : 'Supabase disconnected.');
      };

      const handleSeedDataToSb = async () => {
        if (!sbClient) throw new Error('Supabase client tidak tersedia.');
        try {
          const { data: authSession } = await sbClient.auth.getSession();
          if (!authSession.session) {
            throw new Error(lang === 'id'
              ? 'Masuk terlebih dahulu untuk mengunggah katalog aktivitas.'
              : 'Sign in first to upload the activity catalog.');
          }
          const seededActivities = await loadOrSeedActivities(sbClient, true);
          setDatabaseActivities(seededActivities);
          showToast(seededActivities.length
            ? (lang === 'id' ? 'Pustaka aktivitas sudah sinkron dengan Supabase.' : 'The activity library is synced with Supabase.')
            : (lang === 'id' ? 'Pustaka aktivitas di Supabase masih kosong.' : 'The Supabase activity catalog is empty.'));
        } catch (e) {
          console.error('Gagal menyinkronkan pustaka aktivitas:', e);
          showToast(lang === 'id' ? 'Gagal sinkron pustaka: ' + e.message : 'Activity sync failed: ' + e.message);
        }
      };

      // Modal & Toast State
      const [selectedActivity, setSelectedActivity] = useState(null);
      const [journalActivity, setJournalActivity] = useState(null);
      const [isJournalModalOpen, setIsJournalModalOpen] = useState(false);
      const [toastText, setToastText] = useState('');

      // Filter Library State
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('Semua');
      const [selectedDuration, setSelectedDuration] = useState('Semua');

      const showToast = (msg) => {
        setToastText(msg);
        setTimeout(() => setToastText(''), 3500);
      };

      // Prioritize the active child's journal preferences, then fall back to age and interests.
      const recommendedActivity = useMemo(() => {
        if (!activeChild) return appActivities[0];
        const childJournals = journals.filter(entry => entry.childId === activeChild.id);
        const categoryPreferences = ['Montessori', 'STEM', 'Literasi', 'Numerasi']
          .map(category => {
            const entries = childJournals.filter(entry => entry.category === category);
            return {
              category,
              count: entries.length,
              averageEngagement: entries.length
                ? entries.reduce((sum, entry) => sum + Number(entry.engagement || 0), 0) / entries.length
                : 0
            };
          })
          .filter(preference => preference.count > 0)
          .sort((a, b) => b.count - a.count || b.averageEngagement - a.averageEngagement);

        const favoriteCategory = categoryPreferences[0]?.category;
        if (favoriteCategory) {
          const matchingActivities = appActivities.filter(activity =>
            activity.category === favoriteCategory &&
            activeChild.age >= activity.minAge &&
            activeChild.age <= activity.maxAge
          );
          if (matchingActivities.length) {
            const activityCounts = childJournals.reduce((counts, entry) => {
              counts[entry.activityTitle] = (counts[entry.activityTitle] || 0) + 1;
              return counts;
            }, {});
            return matchingActivities.sort((a, b) =>
              (activityCounts[a.title.id] || activityCounts[a.title.en] || 0) -
              (activityCounts[b.title.id] || activityCounts[b.title.en] || 0)
            )[0];
          }
        }

        const match = appActivities.find(a => 
          activeChild.age >= a.minAge && 
          activeChild.age <= a.maxAge &&
          a.interests.some(int => activeChild.interests.includes(int))
        );
        return match || appActivities[0];
      }, [activeChild, journals, appActivities]);

      // Filter Pustaka Aktivitas
      const filteredActivities = useMemo(() => {
        return appActivities.filter(act => {
          const title = (act.title[lang] || '').toLowerCase();
          const desc = (act.description[lang] || '').toLowerCase();
          const focus = (act.focus[lang] || '').toLowerCase();
          const q = searchQuery.toLowerCase();

          const matchesSearch = title.includes(q) || desc.includes(q) || focus.includes(q);
          const matchesCategory = selectedCategory === 'Semua' || act.category === selectedCategory;
          const matchesDuration = selectedDuration === 'Semua' ||
            (selectedDuration === '<15' && act.duration <= 15) ||
            (selectedDuration === '20+' && act.duration >= 20);

          return matchesSearch && matchesCategory && matchesDuration;
        });
      }, [appActivities, searchQuery, selectedCategory, selectedDuration, lang]);

      // Simpan Jurnal Baru
      const handleSaveJournal = async (journalEntry) => {
        if (!activeChild) {
          showToast(lang === 'id' ? '⚠️ Profil anak tidak tersedia.' : '⚠️ Child profile is unavailable.');
          return false;
        }
        const newLog = {
          id: 'j-' + Date.now(),
          childId: activeChild.id,
          activityTitle: journalEntry.title,
          date: lang === 'id' ? 'Baru saja' : 'Just now',
          dateEn: 'Just now',
          engagement: journalEntry.engagement,
          focusMinutes: Number(journalEntry.focusMinutes || 0),
          notes: journalEntry.notes || (lang === 'id' ? 'Aktivitas berlangsung seru dan fokus.' : 'Fun and engaging session!'),
          notesEn: journalEntry.notes,
          category: journalEntry.category || 'Montessori',
          tag: journalEntry.tag || 'Eksplorasi'
        };

        if (isLocalSession) {
          try {
            const storedJournals = localStorage.getItem(LOCAL_JOURNAL_STORAGE_KEY);
            const localJournals = storedJournals ? JSON.parse(storedJournals) : [];
            if (!Array.isArray(localJournals)) throw new Error('Format jurnal lokal tidak valid.');
            newLog.id = `local-${Date.now()}`;
            const updatedJournals = [newLog, ...localJournals];
            localStorage.setItem(LOCAL_JOURNAL_STORAGE_KEY, JSON.stringify(updatedJournals));
            setJournals(updatedJournals);
          } catch (error) {
            console.error('Gagal menyimpan jurnal ke penyimpanan lokal:', error);
            showToast(lang === 'id'
              ? '⚠️ Jurnal lokal gagal disimpan. Periksa ruang dan izin penyimpanan browser.'
              : '⚠️ Local journal could not be saved. Check browser storage space and permissions.');
            return false;
          }
          if (journalEntry.activityId && !completedActivityIds.includes(journalEntry.activityId)) {
            setCompletedActivityIds(current => [...current, journalEntry.activityId]);
          }
          setIsJournalModalOpen(false);
          setSelectedActivity(null);
          setJournalActivity(null);
          setActiveTab('dashboard');
          showToast(lang === 'id' ? 'Jurnal tersimpan di browser ini (mode lokal).' : 'Journal saved in this browser (local mode).');
          return true;
        }

        if (!sbClient || !activeChild) {
          showToast(lang === 'id'
            ? '⚠️ Tidak tersimpan: koneksi database atau profil anak tidak tersedia.'
            : '⚠️ Not saved: the database connection or child profile is unavailable.');
          return false;
        }
        if (journalEntry.activityId && !journalEntry.databaseActivityId) {
          showToast(lang === 'id'
            ? '⚠️ ID aktivitas belum sinkron dari database. Muat ulang aplikasi lalu coba lagi.'
            : '⚠️ The activity ID is not synced from the database. Reload the app and try again.');
          return false;
        }

        let saveResult = { ok: false };
        try {
          saveResult = await saveJournalEntry({
            ...newLog,
            childId: activeChild.id,
            activityId: journalEntry.databaseActivityId,
            activityTitle: newLog.activityTitle
          }, sbClient);
        } catch (error) {
          console.error('Gagal menyimpan jurnal ke Supabase:', error);
        }

        if (!saveResult.ok) {
          showToast(lang === 'id'
            ? '⚠️ Jurnal belum tersimpan ke Supabase. Periksa koneksi dan pengaturan tabel, lalu coba lagi.'
            : '⚠️ The journal was not saved to Supabase. Check the connection and table settings, then try again.');
          return false;
        }
        newLog.id = saveResult.journal.id;
        setJournals(current => [newLog, ...current]);
        if (journalEntry.activityId && !completedActivityIds.includes(journalEntry.activityId)) {
          setCompletedActivityIds(current => [...current, journalEntry.activityId]);
        }
        setIsJournalModalOpen(false);
        setSelectedActivity(null);
        setJournalActivity(null);
        setActiveTab('dashboard');
        showToast(saveResult.activityLogError
          ? (lang === 'id'
            ? 'Jurnal tersimpan, tetapi log aktivitas gagal disimpan. Periksa izin activity_logs.'
            : 'Journal saved, but the activity log failed. Check activity_logs permissions.')
          : (lang === 'id'
            ? 'Jurnal berhasil disimpan!'
            : 'Journal saved successfully!'));
        return true;
      };

      return (
        <div className="min-h-screen bg-stone-100/70 flex flex-col font-sans">
          
          {/* TOAST NOTIFIKASI */}
          {toastText && (

              <Icon name="sparkles" className="w-5 h-5 text-amber-400" />
              <span className="text-sm font-semibold">{toastText}</span>

          {/* ========================================================== */}
          {/* 1. HALAMAN LOGIN SEDERHANA DENGAN TOGGLE MATA PASSWORD     */}

          {currentScreen === 'login' && (
            <SimpleLoginScreen

          {/* ========================================================== */}

          {/* ========================================================== */}
          {currentScreen === 'app' && (
            <div className="flex h-screen overflow-hidden">
              
              {/* SIDEBAR NAVIGATION KIRI */}
              <aside className="w-72 bg-white border-r border-stone-200/90 flex flex-col justify-between shrink-0 shadow-xs z-20">
                <div>
                  {/* Brand Header */}
                  <div className="p-6 border-b border-stone-100 flex items-center gap-3.5">

                      🌱
                    </div>

                        {t.appName}

                    <SidebarItem

                    <SidebarItem

                    <SidebarItem
                      icon="check"

                      onClick={() => setActiveTab('milestones')}

                  </nav>
                </div>

                {/* Profil Orang Tua Aktif & Tombol Logout */}
                <div className="p-4 border-t border-stone-100 bg-stone-50/80 m-3 rounded-2xl border border-stone-200/60">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2.5 overflow-hidden">

                        {currentParent.avatar}

                      <div className="overflow-hidden">
                        <h4 className="text-xs font-bold text-slate-800 truncate">{currentParent.name}</h4>
                        <p className="text-[10px] text-sage-600 font-semibold truncate">

                        }
                        setCurrentParent(null);

                      🚪

              </aside>

              {/* AREA KANAN: TOP HEADER + MAIN CONTENT CANVAS */}
              <div className="flex-1 flex flex-col h-screen overflow-hidden">
                
                {/* TOP HEADER DESKTOP */}

                      {activeTab === 'library' && t.navLibrary}
                      {activeTab === 'journal' && t.navJournal}
                      {activeTab === 'milestones' && t.navMilestones}
                    </span>

                  </div>

                  {/* KONTROL HEADER: SWITCHER PROFIL ANAK & TOGGLE BAHASA INSTAN */}
                  <div className="flex items-center gap-4">
                    
                    {/* Switcher Profil Anak (Dinamis Sesuai Akun Orang Tua) */}

                      >
                        🇬🇧 EN

                    </div>
                    </div>

                <main className="flex-1 overflow-y-auto p-8 custom-scroll bg-warmcream">

              onClose={() => setSelectedActivity(null)}

          {/* ========================================================== */}

          {/* ========================================================== */}
          {isJournalModalOpen && (

              lang={lang}

    // ====================================================================
    // VIEW 3: JURNAL OBSERVASI DESKTOP
    // ====================================================================

      const [analysis, setAnalysis] = useState(null);
      const [analysisContext, setAnalysisContext] = useState(null);
      const [isAnalysisLoading, setIsAnalysisLoading] = useState(false);
      const [analysisUpdated, setAnalysisUpdated] = useState(false);
      const journalSignature = journals.map(entry => entry.id).join('|');
      const hasCurrentAnalysis = analysis &&
        analysisContext?.childId === child?.id &&
        analysisContext?.lang === lang &&
        analysisContext?.journalSignature === journalSignature;
      const categoryLabels = {
        Montessori: t.categoryMontessori,
        STEM: t.categoryStem,
        Literasi: t.categoryLiteracy,
        Numerasi: t.categoryNumeracy
      };
      const summary = createTalentSummary(journals, lang);
      const categorizedJournalCount = summary.stats.reduce((total, item) => total + item.count, 0);
      const getCategoryPercentage = count => categorizedJournalCount
        ? count / categorizedJournalCount * 100
        : 0;
      const mostPlayed = [...summary.stats].sort((a, b) => b.count - a.count)[0];
      const mostLiked = [...summary.stats].filter(item => item.count)
        .sort((a, b) => b.averageEngagement - a.averageEngagement)[0];

      return (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <div>
              <h2 className="text-2xl font-bold font-display text-slate-900">{t.journalHeading}</h2>
              <p className="text-xs text-slate-500 mt-1">{t.journalSub}</p>
            </div>
            <button
              onClick={onOpenNewJournalModal}
              className="hover-lift px-5 py-2.5 bg-sage-600 hover:bg-sage-700 text-white font-bold rounded-xl text-xs shadow-md shadow-sage-600/20 transition flex items-center gap-2"
            >
              <Icon name="plus" className="w-4 h-4" />
              <span>{t.writeJournal}</span>
            </button>
          </div>

          <section className="bg-white p-6 rounded-3xl border border-stone-200/90 shadow-2xs space-y-5">
            <div>
              <h3 className="font-display font-bold text-lg text-slate-900">{t.progressSummary}</h3>
              <p className="text-xs text-slate-500 mt-1">
                {lang === 'id' ? `Ringkasan catatan untuk ${child?.name}.` : `Journal overview for ${child?.name}.`}
              </p>
            </div>
            {journals.length === 0 && (
              <p className="text-sm text-slate-500 bg-stone-50 p-4 rounded-2xl">{t.noJournalEntries}</p>
            )}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="hover-lift p-4 rounded-2xl bg-sage-50/70 border border-sage-100">
                    <h4 className="text-xs font-bold uppercase tracking-wide text-sage-800 mb-3">{t.playFrequency}</h4>
                    <div className="space-y-3">
                      {summary.stats.map(item => (
                        <div key={item.category}>
                          <div className="flex justify-between text-xs mb-1">
                            <span className="font-semibold text-slate-700">{categoryLabels[item.category]}</span>
                            <span className="text-slate-500">
                              {item.count} {lang === 'id' ? 'jurnal' : 'journals'} · {getCategoryPercentage(item.count).toFixed(0)}%
                            </span>
                          </div>
                          <div
                            className="h-2.5 bg-white rounded-full overflow-hidden"
                            role="progressbar"
                            aria-label={`${categoryLabels[item.category]} ${getCategoryPercentage(item.count).toFixed(0)}%`}
                            aria-valuemin="0"
                            aria-valuemax="100"
                            aria-valuenow={Math.round(getCategoryPercentage(item.count))}
                          >
                            <div
                              className="h-full bg-sage-600 rounded-full transition-all"
                              style={{ width: `${getCategoryPercentage(item.count)}%` }}
                            ></div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                  <div className="hover-lift p-4 rounded-2xl bg-amber-50/60 border border-amber-100">
                    <h4 className="text-xs font-bold uppercase tracking-wide text-amber-900 mb-3">{t.favoriteCategory}</h4>
                    {mostLiked ? (
                      <div className="space-y-3">
                        {summary.stats.filter(item => item.count).map(item => (
                          <div key={item.category}>
                            <div className="flex justify-between text-xs mb-1">
                              <span className="font-semibold text-slate-700">{categoryLabels[item.category]}</span>
                              <span className="text-slate-500">{item.averageEngagement.toFixed(1)} / 5</span>
                            </div>
                            <div className="h-2.5 bg-white rounded-full overflow-hidden">
                              <div
                                className="h-full bg-amber-400 rounded-full transition-all"
                                style={{ width: `${Math.min(100, Math.max(4, item.averageEngagement / 5 * 100))}%` }}
                              ></div>
                            </div>
                          </div>
                        ))}
                        <p className="text-xs font-bold text-amber-900 pt-1">
                          {lang === 'id' ? 'Paling disukai:' : 'Most enjoyed:'} {categoryLabels[mostLiked.category]}
                        </p>
                      </div>
                    ) : (
                      <p className="text-xs text-slate-500">{t.noJournalEntries}</p>
                    )}
                  </div>
            </div>
            {categorizedJournalCount > 0 && (
              <p className="text-[11px] text-slate-500">
                {lang === 'id' ? 'Paling sering dimainkan:' : 'Played most often:'} <b>{categoryLabels[mostPlayed.category]}</b>
              </p>
            )}
          </section>

          {/* LINIMASA JURNAL OBSERVASI */}
          <section className="space-y-4">
            <h3 className="font-display font-bold text-lg text-slate-900">{t.journalHistory}</h3>
            {journals.length === 0 && (
              <p className="text-sm text-slate-500 bg-white p-5 rounded-2xl border border-stone-200">{t.noJournalEntries}</p>
            )}
          <div className="space-y-4">
            {journals.map(entry => (
              <div key={entry.id} className="hover-lift bg-white p-6 rounded-3xl border border-stone-200/90 shadow-2xs space-y-3">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[11px] font-bold text-sage-700 uppercase bg-sage-50 px-2 py-0.5 rounded-md">
                      {entry.category}
                    </span>
                    <h3 className="font-bold text-base text-slate-900 mt-1">{entry.activityTitle}</h3>
                    <span className="text-xs text-slate-500">
                      {lang === 'id' ? entry.date : (entry.dateEn || entry.date)}
                    </span>
                  </div>

                  <div className="flex items-center gap-1 text-amber-400">
                    {[...Array(5)].map((_, i) => (
                      <span key={i} className={`text-base ${i < entry.engagement ? 'text-amber-400' : 'text-stone-200'}`}>
                        ★
                      </span>
                    ))}
                    <span className="text-xs font-bold text-slate-600 ml-2">
                      {entry.engagement} / 5
                    </span>
                  </div>
                </div>

                <div className="bg-stone-50 p-4 rounded-2xl border border-stone-200/70 text-xs text-slate-800 leading-relaxed italic">
                  "{lang === 'id' ? entry.notes : (entry.notesEn || entry.notes)}"
                </div>

                <div className="flex items-center justify-between text-xs pt-1">
                  <span className="bg-sage-100 text-sage-800 px-3 py-1 rounded-lg font-bold">
                    #{entry.tag}
                  </span>
                  <div className="flex gap-3 text-slate-500 font-medium">
                    {entry.focusMinutes > 0 && (
                      <span>{t.focusLabel}: <b>{entry.focusMinutes} {t.minutesUnit}</b></span>
                    )}
                    <span>{lang === 'id' ? 'Catatan untuk: ' : 'Journal for: '}<b>{child?.name}</b></span>
                  </div>
                </div>
              </div>
            ))}
          </div>
          </section>

          <section className="bg-white p-6 md:p-7 rounded-3xl border border-sage-200 shadow-2xs space-y-5">
            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
              <div>
                <h3 className="font-display font-bold text-lg text-slate-900">{t.aiSummaryTitle}</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-2xl">{t.aiSummaryDescription}</p>
              </div>
              <button
                type="button"
                disabled={isAnalysisLoading}
                aria-busy={isAnalysisLoading}
                onClick={async () => {
                  setIsAnalysisLoading(true);
                  setAnalysisUpdated(false);
                  try {
                    await new Promise(resolve => setTimeout(resolve, 450));
                    const refreshedSummary = createTalentSummary(journals, lang);
                    setAnalysis(refreshedSummary);
                    setAnalysisContext({ childId: child?.id, lang, journalSignature });
                    setAnalysisUpdated(true);
                  } finally {
                    setIsAnalysisLoading(false);
                  }
                }}
                className="px-4 py-2.5 bg-sage-600 hover:bg-sage-700 disabled:bg-sage-500 disabled:cursor-wait text-white font-bold rounded-xl text-xs shadow-sm transition shrink-0"
              >
                <span className="inline-flex items-center gap-2">
                  {isAnalysisLoading && <span aria-hidden="true" className="w-3 h-3 rounded-full border-2 border-white/50 border-t-white animate-spin"></span>}
                  {isAnalysisLoading
                    ? t.refreshingAiSummary
                    : (hasCurrentAnalysis ? t.refreshAiSummary : t.generateAiSummary)}
                </span>
              </button>
            </div>
            {hasCurrentAnalysis && analysisUpdated && (
              <p role="status" className="text-xs text-emerald-700" key={journalSignature}>
                {t.analysisUpdated}
              </p>
            )}
            {hasCurrentAnalysis ? (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-3">
                {analysis.sections.map((section, index) => (
                  <article key={section.title} className="p-4 rounded-2xl bg-sage-50/70 border border-sage-100">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="w-6 h-6 rounded-full bg-white text-sage-700 flex items-center justify-center font-bold text-xs">{index + 1}</span>
                      <h4 className="font-bold text-sage-800 text-xs">{section.title}</h4>
                    </div>
                    <p className="text-xs leading-relaxed text-slate-700">{section.text}</p>
                  </article>
                ))}
              </div>
            ) : (
              <p className="text-xs text-slate-500 bg-stone-50 p-4 rounded-2xl">
                {lang === 'id'
                  ? 'Tekan tombol untuk merangkum kategori favorit, antusiasme, durasi fokus, dan kata kunci observasi.'
                  : 'Generate a summary of favorite categories, engagement, focus duration, and observation keywords.'}
              </p>
            )}
          </section>
        </div>
      );
    }

    function MilestonesDesktopView({ lang, t, child, milestones, isLoading, savingIds, onAssess }) {
      const [noteDrafts, setNoteDrafts] = useState({});
      const categories = [
        { id: 'Motorik & Montessori', en: 'Motor Skills & Montessori', icon: '🌱' },
        { id: 'Logika & STEM', en: 'Logic & STEM', icon: '🔬' },
        { id: 'Literasi & Bahasa', en: 'Literacy & Language', icon: '📚' },
        { id: 'Numerasi', en: 'Numeracy', icon: '🔢' }
      ];
      const achievedCount = milestones.filter(item => item.is_achieved).length;
      const progress = milestones.length
        ? Math.round(milestones.reduce((total, item) => total + getMilestoneAssessmentScore(item), 0) / milestones.length)
        : 0;
      const ageGroup = getMilestoneAgeGroup(Number(child?.age) || 2);
      const assessmentOptions = [
        { id: 'not_observed', label: t.milestoneNotObserved, selected: 'bg-stone-700 text-white border-stone-700', idle: 'text-stone-600 border-stone-200 hover:bg-stone-50' },
        { id: 'developing', label: t.milestoneDeveloping, selected: 'bg-amber-500 text-white border-amber-500', idle: 'text-amber-800 border-amber-200 hover:bg-amber-50' },
        { id: 'independent', label: t.milestoneIndependent, selected: 'bg-sage-600 text-white border-sage-600', idle: 'text-sage-800 border-sage-200 hover:bg-sage-50' }
      ];
      const getCategoryProgress = category => {
        const categoryItems = milestones.filter(item => item.domain === category.id);
        return categoryItems.length
          ? Math.round(categoryItems.reduce((total, item) => total + getMilestoneAssessmentScore(item), 0) / categoryItems.length)
          : 0;
      };

      return (
        <div className="space-y-6">
          <div>
            <h2 className="text-2xl font-bold font-display text-slate-900">{t.milestoneHeading}</h2>
            <p className="text-xs text-slate-500 mt-1">{t.milestoneSub}</p>
          </div>

          <section className="bg-white p-6 rounded-3xl border border-sage-200 shadow-2xs">
              <div className="flex flex-col lg:flex-row lg:items-center gap-6">
                <div>
                  <p className="text-xs font-bold uppercase tracking-wide text-sage-700">
                    {lang === 'id' ? ageGroup.label.id : ageGroup.label.en}
                  </p>
                  <h3 className="font-display font-bold text-lg text-slate-900 mt-1">
                    {t.forChild} {child?.name}
                  </h3>
                  <p className="text-xs font-bold uppercase tracking-wide text-stone-500 mt-3">{t.milestoneReportTitle}</p>
                  <div className="flex items-baseline gap-2 mt-1">
                    <span className="font-display text-4xl font-bold text-sage-700">{progress}%</span>
                    <span className="text-xs text-slate-500">{t.milestoneOverall}</span>
                  </div>
                  <p className="text-[11px] text-slate-500 mt-1">{achievedCount} / {milestones.length} {t.milestoneDone}</p>
                </div>
                <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {categories.map(category => {
                    const categoryProgress = getCategoryProgress(category);
                    return (
                      <div key={category.id} className="p-3 rounded-2xl bg-stone-50 border border-stone-100">
                        <div className="flex justify-between gap-2 text-[11px] font-semibold text-slate-700 mb-2">
                          <span className="truncate">{category.icon} {lang === 'id' ? category.id : category.en}</span>
                          <span>{categoryProgress}%</span>
                        </div>
                        <div
                          className="h-2 rounded-full bg-white overflow-hidden"
                          role="progressbar"
                          aria-label={`${lang === 'id' ? category.id : category.en}: ${categoryProgress}%`}
                          aria-valuemin="0"
                          aria-valuemax="100"
                          aria-valuenow={categoryProgress}
                        >
                          <div className="h-full rounded-full bg-sage-600 transition-all" style={{ width: `${categoryProgress}%` }}></div>
                        </div>
                      </div>
                    );
                  })}
                </div>
            </div>
          </section>

          {isLoading ? (
            <p role="status" className="bg-white p-5 rounded-2xl border border-stone-200 text-sm text-slate-500">{t.milestoneLoading}</p>
          ) : milestones.length === 0 ? (
            <p className="bg-white p-5 rounded-2xl border border-stone-200 text-sm text-slate-500">{t.milestoneEmpty}</p>
          ) : (
            <div className="grid grid-cols-1 xl:grid-cols-2 gap-5">
              {categories.map(category => {
                const items = milestones.filter(item => item.domain === category.id);
                if (!items.length) return null;
                return (
                  <section key={category.id} className="bg-white p-5 rounded-3xl border border-stone-200/90 shadow-2xs space-y-3">
                    <h3 className="font-display font-bold text-base text-slate-900 flex items-center gap-2">
                      <span aria-hidden="true">{category.icon}</span>
                      {lang === 'id' ? category.id : category.en}
                    </h3>
                    <div className="space-y-2">
                      {items.map(item => (
                        <article
                          key={item.id || item.milestone_key}
                          className="p-4 rounded-2xl border border-stone-200 bg-stone-50/70 space-y-3"
                        >
                          {(() => {
                            const review = readMilestoneReview(item);
                            const selectedLevel = review.assessment_level;
                            const isSaving = savingIds.includes(item.id);
                            const noteValue = Object.prototype.hasOwnProperty.call(noteDrafts, item.id)
                              ? noteDrafts[item.id]
                              : review.parent_note;
                            return (
                              <>
                                <p className="text-xs leading-relaxed font-semibold text-slate-800">
                                  {lang === 'id' ? item.description : review.englishDescription}
                                </p>
                                <div className="flex flex-wrap gap-2" role="group" aria-label={lang === 'id' ? 'Penilaian orang tua' : 'Parent assessment'}>
                                  {assessmentOptions.map(option => (
                                    <button
                                      key={option.id}
                                      type="button"
                                      disabled={isSaving}
                                      aria-pressed={selectedLevel === option.id}
                                      onClick={() => onAssess(item, option.id, noteDrafts[item.id] ?? review.parent_note)}
                                      className={`px-3 py-1.5 rounded-full border text-[10px] font-bold transition disabled:opacity-50 ${
                                        selectedLevel === option.id ? option.selected : `bg-white ${option.idle}`
                                      }`}
                                    >
                                      {option.label}
                                    </button>
                                  ))}
                                </div>
                                <div>
                                  <label className="block text-[10px] font-bold text-slate-600 mb-1" htmlFor={`milestone-note-${item.id}`}>
                                    {t.milestoneParentNote}
                                  </label>
                                  <textarea

        Literasi: t.categoryLiteracy,
        Numerasi: t.categoryNumeracy

        { id: 'Antusias', en: 'Enthusiastic' },

        e.preventDefault();

            title: activityTitle,

            databaseActivityId: activity?.databaseId || null,

            category: activityCategory,
            focusMinutes: Number(focusMinutes),
